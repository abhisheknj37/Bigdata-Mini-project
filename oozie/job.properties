# ==============================================================================
# Apache Oozie Configuration Properties File
# Media and Entertainment Data Warehousing Solution on Hadoop
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Hadoop Cluster & Resource Manager Connection Endpoints
# ------------------------------------------------------------------------------
nameNode=hdfs://namenode01.corp.media.internal:8020
jobTracker=resourcemanager01.corp.media.internal:8032
queueName=media_dw_etl

# ------------------------------------------------------------------------------
# 2. Oozie Engine & System Library Settings
# ------------------------------------------------------------------------------
oozie.use.system.libpath=true
oozie.libpath=${nameNode}/user/oozie/share/lib
oozie.action.sharelib.for.sqoop=sqoop,hive
oozie.action.sharelib.for.pig=pig
oozie.action.sharelib.for.hive2=hive2

# Coordinator application URI (HDFS location of coordinator.xml)
oozie.coord.application.path=${nameNode}/apps/media_dw/oozie/coordinator.xml

# Workflow application URI (referenced by coordinator and direct workflow submits)
wfApplicationPath=${nameNode}/apps/media_dw/oozie/workflow.xml
oozie.wf.application.path=${nameNode}/apps/media_dw/oozie/workflow.xml

# Workflow retry on node failure
oozie.wf.rerun.failnodes=true

# ------------------------------------------------------------------------------
# 3. Upstream Relational Source (RDBMS) - Sqoop Ingestion Config
# ------------------------------------------------------------------------------
rdbmsJdbcUrl=jdbc:postgresql://postgres-master.prod.media.internal:5432/media_production
rdbmsUser=dw_ingest_svc
rdbmsPasswordHdfsPath=${nameNode}/apps/media_dw/security/.db_ingest_password.pass
rdbmsMappers=4
rdbmsFetchSize=10000

# ------------------------------------------------------------------------------
# 4. HiveServer2 Warehouse Connection
# ------------------------------------------------------------------------------
hive2JdbcUrl=jdbc:hive2://hiveserver01.corp.media.internal:10000/media_dw;auth=noSasl
hive2User=hive_dw_service
hiveDatabase=media_dw
hiveExecutionEngine=tez

# ------------------------------------------------------------------------------
# 5. Pipeline Directory Structure on HDFS
# ------------------------------------------------------------------------------
hdfsBaseAppDir=${nameNode}/apps/media_dw
hdfsLandingDir=${nameNode}/data/landing
hdfsStagingDir=${nameNode}/data/staging
hdfsCleansedDir=${nameNode}/data/cleansed
hdfsWarehouseDir=${nameNode}/warehouse/tablespace/external/hive/media_dw.db
hdfsArchiveDir=${nameNode}/data/archive

# ------------------------------------------------------------------------------
# 6. Script and Library Paths
# ------------------------------------------------------------------------------
pigCleanseViewingScript=${hdfsBaseAppDir}/pig/cleanse_viewing_logs.pig
pigTransformInteractionsScript=${hdfsBaseAppDir}/pig/transform_interactions.pig
hiveLoadDimensionsScript=${hdfsBaseAppDir}/hive/load_dimensions.hql
hiveLoadFactsScript=${hdfsBaseAppDir}/hive/load_facts.hql
dqCheckScript=${hdfsBaseAppDir}/scripts/data_quality_checks.sh

# ------------------------------------------------------------------------------
# 7. Notification & Alerting Contacts
# ------------------------------------------------------------------------------
alertEmailSuccess=data-warehouse-reports@media-corp.com
alertEmailFailure=data-platform-oncall@media-corp.com,de-team-lead@media-corp.com

# ------------------------------------------------------------------------------
# 8. Data Quality & SLA Thresholds
# ------------------------------------------------------------------------------
dqMaxRowDiffPercent=0.5
dqMaxNullKeyPercent=0.0
dqMaxBufferDurationSec=3600
dqAlertThreshold=WARNING

# ------------------------------------------------------------------------------
# 9. Coordinator Schedule Boundaries (UTC)
# ------------------------------------------------------------------------------
coordStart=2026-01-01T02:00Z
coordEnd=2030-12-31T02:00Z
coordTimezone=UTC
